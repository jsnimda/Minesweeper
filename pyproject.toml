[project]
name = "minesweeper"
version = "0.1.0"
description = "Minesweeper recognition and solving"
readme = "README.md"
authors = [
    { name = "jsnimda", email = "7615255+jsnimda@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mss>=10.2.0",
    "pyautogui>=0.9.54",
    "pyside6>=6.12.0",
]

[project.scripts]
minesweeper = "minesweeper:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
