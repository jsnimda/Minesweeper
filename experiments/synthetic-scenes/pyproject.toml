[project]
name = "synthetic-scenes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jsnimda", email = "7615255+jsnimda@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.5",
    "pydantic>=2,<3",
    "pillow>=13.0.0",
    "tqdm>=4.70.1",
    "skia-python>=144.1",
]

[project.scripts]
synthetic-scenes = "synthetic_scenes.dataset:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
