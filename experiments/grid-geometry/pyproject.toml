[project]
name = "grid-geometry"
version = "0.1.0"
description = "Minesweeper grid geometry recognition"
readme = "README.md"
requires-python = "==3.13.18"
dependencies = [
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "torch==2.15.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pydantic>=2,<3",
    "pytest>=9.2.0",
    "synthetic-scenes",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
synthetic-scenes = { path = "../synthetic-scenes", editable = true }
torch = [
    { index = "pytorch-cu134", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
