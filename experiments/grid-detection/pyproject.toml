[project]
name = "grid-detection"
version = "0.1.0"
description = "Minesweeper grid detection research"
readme = "README.md"
authors = [
    { name = "jsnimda", email = "7615255+jsnimda@users.noreply.github.com" }
]
requires-python = "==3.13.18"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "skia-python>=144.1",
    "tqdm>=4.70.1",
    "synthetic-scenes",
    "torch==2.15.0; sys_platform == 'darwin'",
    "torch==2.15.0+cu134; sys_platform == 'linux'",
    "torchvision",
    "ultralytics==8.4.216",
    "pyyaml>=6.0.4",
]

[project.scripts]
grid-detection = "grid_detection:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
synthetic-scenes = { path = "../synthetic-scenes", editable = true }
torch = [
    { index = "pytorch-cu134", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

torchvision = [
    { index = "pytorch-cu134", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true
